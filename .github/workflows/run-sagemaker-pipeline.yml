name: Run SageMaker Pipeline

# Manual trigger by default (Actions tab -> "Run workflow") to avoid triggering
# billable SageMaker jobs on every push. Add a `push:` trigger below once is
# comfortable with the cost, and scope it with `paths:` so it only
# fires when src/, pipeline/, or config/ actually change.
on:
  workflow_dispatch:
    inputs:
      wait_for_completion:
        description: "Poll until the pipeline finishes (uses more Action minutes)"
        type: boolean
        default: true
  # push:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "pipeline/**"
  #     - "config/**"

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: sagemaker-prod   # optional: require a reviewer approval in repo Settings > Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-sagemaker-team09
          aws-region: ap-southeast-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SageMaker Pipeline
        env:
          SAGEMAKER_EXECUTION_ROLE_ARN: ${{ secrets.SAGEMAKER_EXECUTION_ROLE_ARN }}
        run: |
          if [ "${{ inputs.wait_for_completion }}" = "false" ]; then
            python pipeline/run_pipeline.py --no-wait
          else
            python pipeline/run_pipeline.py
          fi
